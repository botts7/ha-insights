purge_observations:
  name: Purge observations
  description: >
    Clear all observed state events, insights, and outbound-call audit entries.
    Pseudonym map and applied-history snapshots are preserved by design so
    undo paths and stable LLM references still work after a purge.

scan_now:
  name: Scan now
  description: >
    Run all registered detectors immediately against the current state buffer.
    New insights land in the store; subscribed cards see them via the live
    update event stream.

backfill:
  name: Backfill from recorder
  description: >
    Re-populate the state-event buffer from HA's recorder history. Runs
    automatically on first install but can be re-run manually after large
    entity changes or if recorder retention was just extended. Local-only;
    no LLM calls.
  fields:
    lookback_days:
      name: Lookback days
      description: >
        Override the configured lookback window for this run only.
        Range 1-30. Omit to use the integration's configured value.
      example: 14
      selector:
        number:
          min: 1
          max: 30
          step: 1
          mode: slider

reload_ui:
  name: Reload UI bundle
  description: >
    Re-register the HA Insights sidebar panel with a fresh cache-bust
    query string so a freshly-deployed ha-insights-panel.js / ha-insights-
    card.js is picked up without an HA restart. Workflow: copy the new
    bundle into /config/www/, call this service, then hard-refresh the
    browser. The "🔄 Reload UI" button in the panel header calls this
    same service.
