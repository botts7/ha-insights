services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2025.4
    container_name: ha-insights-dev
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      - ../custom_components/ha_insights:/config/custom_components/ha_insights
    environment:
      TZ: ${TZ:-Etc/UTC}
    restart: unless-stopped
