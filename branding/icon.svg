<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HA Insights icon">
  <title>HA Insights</title>

  <!--
    v24 — halos removed, no symbol indirection. Nodes are plain inline
    circles. Clean tile (single linear gradient, no sheen/hex grid).
  -->

  <defs>
    <linearGradient id="tileBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <radialGradient id="lensFill" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset="1" stop-color="#FFCB66"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#tileBase)"/>

  <path
    d="M 80 224
       L 248 80
       Q 256 74 264 80
       L 432 224
       L 432 404
       Q 432 444 392 444
       L 120 444
       Q 80 444 80 404
       Z"
    fill="#FFFFFF" opacity="0.97"/>

  <!-- Branches -->
  <g stroke="#0288D1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="256" y1="296" x2="184" y2="224" stroke-width="4"/>
    <line x1="184" y1="224" x2="124" y2="160" stroke-width="2.5"/>
    <line x1="184" y1="224" x2="160" y2="120" stroke-width="2.5"/>
    <line x1="256" y1="296" x2="264" y2="200" stroke-width="3.5"/>
    <line x1="264" y1="200" x2="232" y2="124" stroke-width="2.5"/>
    <line x1="264" y1="200" x2="312" y2="140" stroke-width="2.5"/>
    <line x1="256" y1="296" x2="344" y2="240" stroke-width="3"/>
    <line x1="344" y1="240" x2="408" y2="180" stroke-width="2.5"/>
    <line x1="256" y1="296" x2="184" y2="352" stroke-width="3"/>
    <line x1="184" y1="352" x2="128" y2="372" stroke-width="2.5"/>
    <line x1="184" y1="352" x2="188" y2="404" stroke-width="2.5"/>
  </g>

  <!-- Nodes: solid Light Blue 900 dots, no halo, no rings -->
  <g fill="#01579B">
    <circle cx="184" cy="224" r="8"/>
    <circle cx="124" cy="160" r="6"/>
    <circle cx="160" cy="120" r="6"/>
    <circle cx="264" cy="200" r="8"/>
    <circle cx="232" cy="124" r="6"/>
    <circle cx="312" cy="140" r="6"/>
    <circle cx="344" cy="240" r="8"/>
    <circle cx="408" cy="180" r="6"/>
    <circle cx="184" cy="352" r="8"/>
    <circle cx="128" cy="372" r="6"/>
    <circle cx="188" cy="404" r="6"/>
    <circle cx="256" cy="296" r="11"/>
  </g>

  <!-- Magnifier -->
  <g transform="translate(340 372)">
    <circle cx="0" cy="0" r="85" fill="url(#lensFill)"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#E08A1E" stroke-width="12"/>
    <line x1="-44" y1="34" x2="44" y2="34" stroke="#C77A1A" stroke-width="4" stroke-linecap="round"/>
    <rect x="-36" y="10"  width="18" height="24" rx="2.5" fill="#E89C30"/>
    <rect x="-9"  y="-12" width="18" height="46" rx="2.5" fill="#E89C30"/>
    <rect x="18"  y="-34" width="18" height="68" rx="2.5" fill="#E89C30"/>
  </g>

  <rect x="400" y="432" width="56" height="20"
        transform="rotate(45 400 432)" fill="#E08A1E" rx="10"/>

  <g transform="translate(456 320)">
    <path d="M 0 -14 L 3 -3 L 14 0 L 3 3 L 0 14 L -3 3 L -14 0 L -3 -3 Z"
          fill="#FFB300"/>
  </g>
</svg>
