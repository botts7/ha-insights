[project]
name = "ha_insights"
version = "0.1.0-dev"
description = "HA Insights for Home Assistant — proactive routine detection and automation suggestions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "botts7" }]

[project.optional-dependencies]
dev = [
    "homeassistant>=2025.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
