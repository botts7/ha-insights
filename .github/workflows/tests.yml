name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install homeassistant pytest pytest-asyncio pytest-homeassistant-custom-component ruff aiosqlite hassil home-assistant-intents
      - run: ruff check .
      - run: pytest -q tests/
